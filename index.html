<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Australia</title>
    <meta name="description" content="Simple white landing page with a centered header and a single hero image." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-group header-left">
        <a href="services.html">SERVICES</a>
        <a href="products.html">PRODUCTS</a>
        <a href="territory.html">THE TERRITORIES</a>
      </div>

      <div class="brand-block">
        <a class="brand-link" href="index.html">
          <div class="brand-mark">YYSP</div>
          <div class="brand-subtitle">PTY LTD</div>
        </a>
      </div>

      <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="header-group header-right">
        <a href="about.html">ABOUT US</a>
        <a href="contact.html">CONTACT</a>
        <div class="social-links">
          <a href="https://www.instagram.com" aria-label="Instagram" class="social-icon">
            <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M349.33 69.33H162.67C109.57 69.33 69.33 109.57 69.33 162.67v186.67C69.33 402.43 109.57 442.67 162.67 442.67h186.67c53.1 0 93.33-40.24 93.33-93.33V162.67c0-53.1-40.24-93.34-93.34-93.34zm62.67 280c0 34.49-28.18 62.67-62.67 62.67H162.67c-34.49 0-62.67-28.18-62.67-62.67V162.67c0-34.49 28.18-62.67 62.67-62.67h186.67c34.49 0 62.67 28.18 62.67 62.67v186.66z"/>
              <path d="M256 170.67c-46.67 0-85.33 38.67-85.33 85.33S209.33 341.33 256 341.33 341.33 302.67 341.33 256 302.67 170.67 256 170.67zm0 138.66c-29.41 0-53.33-23.92-53.33-53.33s23.92-53.33 53.33-53.33 53.33 23.92 53.33 53.33-23.92 53.33-53.33 53.33z"/>
              <circle cx="377.33" cy="134.67" r="21.33"/>
            </svg>
          </a>
          <a href="https://www.facebook.com" aria-label="Facebook" class="social-icon">
            <svg viewBox="0 0 320 512" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M279.14 288l14.22-92.66h-88.91V134.33c0-25.35 12.42-50.06 52.24-50.06H293V6.26S259.36 0 225.36 0c-73.22 0-121.09 44.38-121.09 124.72V195.3H22.89V288h81.38v224h100.2V288z"/>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="hero-section homepage-hero">
      <img
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80"
        alt="Scenic Australian coastline over water"
      />
      <div class="hero-overlay">
        <h1>Empowering Global Business Success</h1>
      </div>
    </main>

    <script>
      const menuToggle = document.querySelector('.mobile-menu-toggle');
      const siteHeader = document.querySelector('.site-header');
      if (menuToggle && siteHeader) {
        if (!siteHeader.querySelector('.mobile-nav-links')) {
          const mobileNav = document.createElement('div');
          mobileNav.className = 'mobile-nav-links';
          const navLinks = Array.from(siteHeader.querySelectorAll('.header-group > a'));
          navLinks.forEach((link) => {
            const clone = link.cloneNode(true);
            mobileNav.appendChild(clone);
          });
          siteHeader.appendChild(mobileNav);
        }

        menuToggle.addEventListener('click', () => {
          const isOpen = siteHeader.classList.toggle('nav-open');
          menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
      }
    </script>
  </body>
</html>
