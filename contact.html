  <body>
    <header class="site-header">

      <div class="brand-block">
        <a class="brand-link" href="index.html">
          <div class="brand-mark">YYSP</div>
          <div class="brand-subtitle">PTY LTD</div>
        </a>
      </div>

      <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="header-group header-right">
        <a href="about.html">ABOUT US</a>
        <a href="contact.html">CONTACT</a>
        <div class="social-links">
          <a href="#" aria-label="Instagram" class="social-icon">
            <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor" aria-hidden="true">

              <path d="M256 170.67c-46.67 0-85.33 38.67-85.33 85.33S209.33 341.33 256 341.33 341.33 302.67 341.33 256 302.67 170.67 256 170.67zm0 138.66c-29.41 0-53.33-23.92-53.33-53.33s23.92-53.33 53.33-53.33 53.33 23.92 53.33 53.33-23.92 53.33-53.33 53.33z"/>

    </header>

    <main class="contact-page">
      <section class="contact-hero">
        <img
          src="https://images.unsplash.com/photo-1493558103817-58b2924bce98?auto=format&fit=crop&w=1600&q=80"
          alt="Coastal contact background"
        />
        <div class="hero-overlay">
          <h1>Contact us</h1>
        </div>
      </section>

      <section class="contact-grid">
        <div class="contact-info-panel">
          <h2>Contact details</h2>
          <p>Reach out via phone, email, or visit our main office in Brisbane.</p>
          <p><strong>Address</strong><br />2/12 Selhurst Street, Coopers Plains QLD 4108</p>
          <p><strong>Phone</strong><br />+61 7 3274 1888</p>
          <p><strong>Email</strong><br />info@bertrand-export.com</p>
        </div>
        <div class="contact-map-panel">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6437.196661758486!2d153.02358578784036!3d-27.574219411184363!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6b9156f6fb415d7d%3A0x2f4e0abf4f7f0735!2sSelhurst%20St%2C%20Coopers%20Plains%20QLD%204108%2C%20Australia!5e0!3m2!1sen!2sus!4v1710000000000"
            allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </section>
    </main>

    <script>
      const menuToggle = document.querySelector('.mobile-menu-toggle');
      const siteHeader = document.querySelector('.site-header');
      if (menuToggle && siteHeader) {
        if (!siteHeader.querySelector('.mobile-nav-links')) {
          const mobileNav = document.createElement('div');
          mobileNav.className = 'mobile-nav-links';
          const navLinks = Array.from(siteHeader.querySelectorAll('.header-group > a'));
          navLinks.forEach((link) => {
            const clone = link.cloneNode(true);
            mobileNav.appendChild(clone);
          });
          siteHeader.appendChild(mobileNav);
        }

        menuToggle.addEventListener('click', () => {
          const isOpen = siteHeader.classList.toggle('nav-open');
          menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
      }
    </script>
  </body>
</html>
